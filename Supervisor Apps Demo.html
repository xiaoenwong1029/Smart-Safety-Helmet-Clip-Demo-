<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Clip – Supervisor View</title>
<style>
  :root{
    --red:#C8202A; --red-dark:#8E1B1F; --red-deep:#A3171D; --red-soft:#FCEEEE; --red-line:#E8A9AC;
    --orange:#B35500; --orange-soft:#FFF2E5; --orange-line:#F1C9A0;
    --green:#1E6B47; --green-soft:#E8F4EE;
    --blue:#1F4E8C;
    --ink:#1F2328; --ink-2:#3A3F45; --ink-3:#5B6168; --line:#E2E4E6;
    --bg:#F4F4F2; --page:#E9E9E6; --white:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:32px;padding:24px;flex-wrap:wrap}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 0 0 10px #1C1D1F,0 24px 60px rgba(0,0,0,.25);position:relative}
  /* header */
  .hdr{background:var(--red);color:#fff;padding:22px 18px 12px;display:flex;flex-direction:column;gap:10px;transition:background .2s}
  .hdr.infra{background:var(--red-dark)}
  .hdr-top{display:flex;align-items:center;justify-content:space-between}
  .brand{font-size:20px;font-weight:700;letter-spacing:1px}
  .sub{font-size:13px;color:#FBE0E1}
  .bell{width:44px;height:44px;border:none;background:transparent;color:#fff;position:relative;display:flex;align-items:center;justify-content:center}
  .badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:#fff;color:var(--red);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .seg{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px}
  .seg button{flex:1;height:36px;border:none;border-radius:8px;background:transparent;color:#fff;font-size:13px;font-weight:700}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--red-deep)}
  /* content */
  .content{flex:1;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .stat b{font-size:22px}
  .stat span{font-size:12px;color:var(--ink-3)}
  .stat.hot{background:var(--red-soft)} .stat.hot b{color:#B01C25} .stat.hot span{color:var(--red-dark)}
  .stat.good b{color:var(--green)}
  .h{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;text-transform:uppercase;margin:4px 2px 0}
  .empty{background:#fff;border-radius:14px;padding:22px;text-align:center;color:var(--ink-3);font-size:14px}
  /* alert card */
  .card{background:#fff;border-radius:16px;border:2px solid var(--red-line);padding:14px;display:flex;flex-direction:column;gap:10px}
  .card.orange{border-color:var(--orange-line)}
  .card.checking{border-style:dashed}
  .card.ack{border-color:var(--line)}
  .card.flash{animation:flash 1s ease 2}
  @keyframes flash{50%{box-shadow:0 0 0 6px rgba(200,32,42,.25)}}
  .row{display:flex;align-items:center;gap:10px}
  .ic{width:40px;height:40px;border-radius:20px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .ic.orange{background:var(--orange)}
  .ttl{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .ttl strong{font-size:17px;color:#B01C25}
  .ttl strong.orange{color:#9A4A00}
  .ttl span{font-size:14px;color:var(--ink-2)}
  .chip{font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;white-space:nowrap}
  .chip.new{background:var(--red-soft);color:var(--red-dark)}
  .chip.ack{background:var(--green-soft);color:var(--green)}
  .chip.chk{background:var(--orange-soft);color:#7A3B00}
  .meta{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
  .meta div{display:flex;align-items:center;gap:6px}
  .note{border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700}
  .note.warn{background:var(--orange-soft);color:#7A3B00}
  .note.esc{background:var(--red-soft);color:var(--red-dark)}
  .note.ok{background:var(--green-soft);color:var(--green)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-height:44px;border-radius:10px;font-size:14px;font-weight:700;border:1.5px solid var(--red);background:#fff;color:var(--red-deep);padding:0 10px}
  .btn.primary{background:var(--red);color:#fff}
  .btn.icon{flex:none;width:48px;display:flex;align-items:center;justify-content:center;padding:0}
  .btn.grey{border-color:#B9BEC3;color:var(--ink-2)}
  /* maps */
  .map{height:360px;border-radius:16px;position:relative;overflow:hidden;border:1px solid #D3DACE}
  .map.infra{background:#E4EADF}
  .map.floor{background:#F7F7F5;border-color:#DADDE0}
  .road{position:absolute;left:-80px;top:170px;width:560px;height:46px;background:#CDD1D4;transform:rotate(-32deg)}
  .road i{position:absolute;left:0;right:0;top:21px;height:3px;background:#fff}
  .blob{position:absolute;border-radius:50%}
  .room{position:absolute;border:2px solid #B9BEC3;border-radius:4px;font-size:11px;color:var(--ink-3);padding:4px 6px}
  .pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;background:var(--blue);color:#fff;
    font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25);padding:0}
  .pin.med{background:var(--orange)} .pin.alert{background:var(--red);animation:pulse 1.4s infinite} .pin.off{background:#8A9096}
  .pin.hl{outline:3px solid #111;outline-offset:2px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,32,42,.5)}100%{box-shadow:0 0 0 14px rgba(200,32,42,0)}}
  .floatbox{position:absolute;background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:11px;color:var(--ink-2)}
  .levels{display:flex;gap:6px}
  .levels button{flex:1;height:40px;border-radius:8px;border:none;background:#fff;font-size:14px;color:var(--ink-3)}
  .levels button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:700}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  /* workers */
  .wk{background:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;border:none;width:100%;text-align:left;min-height:56px}
  .av{width:38px;height:38px;border-radius:19px;background:#EDEEEF;color:var(--ink-2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .av.big{width:56px;height:56px;border-radius:28px;font-size:18px}
  .wk .ttl strong{font-size:15px;color:var(--ink)}
  .wk .ttl span{font-size:12px;color:var(--ink-3)}
  .st{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px}
  .st.ok{background:var(--green-soft);color:var(--green)} .st.alert{background:var(--red-soft);color:var(--red-dark)}
  .st.med{background:var(--orange-soft);color:#7A3B00} .st.off{background:#EDEEEF;color:var(--ink-3)}
  /* log */
  .log{background:#fff;border-radius:12px;padding:4px 12px}
  .log div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
  .log div:last-child{border-bottom:none}
  .log time{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;width:44px}
  /* nav */
  .nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:10px}
  .nav button{flex:1;height:58px;border:none;background:transparent;font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
  .nav button[aria-current="page"]{color:var(--red);font-weight:700}
  .nav .nb{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  /* sheet */
  .scrim{position:absolute;inset:0;background:rgba(20,20,20,.4);display:flex;align-items:flex-end;z-index:5}
  .sheet{background:#fff;width:100%;max-height:86%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
  .grab{width:40px;height:5px;border-radius:3px;background:#D0D3D6;align-self:center}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;font-size:14px}
  .kv dt{color:var(--ink-3)} .kv dd{margin:0;color:var(--ink)}
  .emg{border:2px solid var(--red-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FFFBFB}
  .emg h3{margin:0;font-size:15px;color:var(--red-dark)}
  .small{font-size:12px;color:var(--ink-3)}
  /* toast */
  .toast{position:absolute;left:14px;right:14px;bottom:84px;background:#1F2328;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  /* demo panel */
  .demo{width:300px;background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .demo h2{margin:0;font-size:18px}
  .demo p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.4}
  .demo .btn{flex:none;width:100%}
  .tag{font-size:12px;color:var(--ink-3);text-align:center}
  @media (max-width:520px){
    .stage{padding:0;gap:16px}
    .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
    .demo{width:calc(100% - 32px);margin-bottom:24px}
  }
</style>
</head>
<body>
<div class="stage">
  <main class="phone" id="app" aria-label="Supervisor view"></main>
  <aside class="demo" aria-label="Demo controls">
    <h2>Demo controls</h2>
    <p>Trigger a clip event on the current site to show how the supervisor is alerted. Concept prototype, sample data only.</p>
    <button class="btn primary" data-act="demo" data-type="fall">Trigger fall</button>
    <button class="btn" data-act="demo" data-type="nomove">Trigger no movement</button>
    <button class="btn" data-act="demo" data-type="heat">Trigger high heat risk</button>
    <button class="btn" data-act="demo" data-type="sos">Trigger SOS button</button>
    <button class="btn grey" data-act="reset">Reset demo</button>
    <p>No-movement check-in is shortened to 15 seconds for the demo. Escalation to the Safety Officer happens if an alert is not acknowledged within 2 minutes.</p>
  </aside>
</div>

<script>
(function(){
  "use strict";

  // ---------- icons ----------
  const svg = (p, s=22) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const I = {
    bell: svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
    warn: svg('<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'),
    clock: svg('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
    temp: svg('<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/>'),
    sos: svg('<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>'),
    pin: svg('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>', 14),
    phone: svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>', 20),
    alerts: svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>', 22),
    map: svg('<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15"/><path d="M15 6v15"/>', 22),
    users: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>', 22),
    log: svg('<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>', 22),
    info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>', 14),
    check: svg('<path d="M20 6 9 17l-5-5"/>', 14),
    sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>', 22)
  };

  // ---------- sample data (fictional) ----------
  const SITES = {
    building: { label: "Building & Data Centre", short: "Building", sub: "Data Centre Site · Block A · 4 levels", locate: "floor beacon" },
    infra:    { label: "Infrastructure", short: "Infrastructure", sub: "Infrastructure Site · Zones 1–4", locate: "GPS" }
  };
  const W = (o) => Object.assign({ status: "ok", heat: "normal", battery: 80, medical: "None declared" }, o);
  const WORKERS = {
    building: [
      W({ id:"B023", name:"Ahmad Razak", role:"Steel Fixer", co:"Subcon A Sdn Bhd (Structure)", level:"L3", zone:"Zone B · Data Hall", x:66, y:72, doc:"IC ••••••-••-5521", contact:"Wife · +60 1•-••• 6789", battery:76 }),
      W({ id:"A017", name:"Rahim Uddin", role:"Electrician", co:"Subcon B Sdn Bhd (M&E)", level:"L2", zone:"Electrical Room", x:82, y:22, doc:"Passport ••••4821 (Bangladesh)", contact:"Brother · +60 1•-••• 2210", medical:"Asthma (worker-declared)", battery:64 }),
      W({ id:"B031", name:"Suresh Kumar", role:"Scaffolder", co:"Subcon A Sdn Bhd (Structure)", level:"L4", zone:"Zone A", x:24, y:30, doc:"IC ••••••-••-3307", contact:"Wife · +60 1•-••• 4412", battery:91 }),
      W({ id:"B044", name:"Tan Wei Ming", role:"Site Engineer", co:"Gamuda", level:"L1", zone:"Loading Bay", x:74, y:24, doc:"IC ••••••-••-1189", contact:"Mother · +60 1•-••• 9031", battery:88 }),
      W({ id:"A022", name:"Nguyen Van Long", role:"Pipe Fitter", co:"Subcon C Sdn Bhd (Mechanical)", level:"L2", zone:"Chiller Room", x:30, y:70, doc:"Passport ••••7742 (Vietnam)", contact:"Wife · +84 9•-••• 1182", battery:57 }),
      W({ id:"B050", name:"Mohd Faiz Hakim", role:"General Worker", co:"Subcon A Sdn Bhd (Structure)", level:"L3", zone:"Zone A", x:24, y:30, doc:"IC ••••••-••-6024", contact:"Father · +60 1•-••• 5560", battery:83 }),
      W({ id:"A030", name:"Kamal Hossain", role:"Cable Puller", co:"Subcon B Sdn Bhd (M&E)", level:"L3", zone:"Zone C · Data Hall", x:80, y:26, doc:"Passport ••••3390 (Bangladesh)", contact:"Cousin · +60 1•-••• 7718", battery:70 }),
      W({ id:"B061", name:"Arjun Thapa", role:"Safety Supervisor", co:"Gamuda", level:"L1", zone:"Site Office", x:24, y:72, doc:"Passport ••••5016 (Nepal)", contact:"Wife · +977 98•-••• 401", battery:95 })
    ],
    infra: [
      W({ id:"C112", name:"Mizanur Rahman", role:"Concreter", co:"Subcon D Sdn Bhd (Civil)", zone:"Zone 3 · Pier P14", x:22, y:74, heat:"high", doc:"Passport ••••6120 (Bangladesh)", contact:"Brother · +60 1•-••• 3341", battery:68 }),
      W({ id:"C105", name:"Lim Kok Seng", role:"Crane Operator", co:"Subcon E Sdn Bhd (Lifting)", zone:"Zone 2 · Launching gantry", x:40, y:58, heat:"medium", doc:"IC ••••••-••-2271", contact:"Wife · +60 1•-••• 8820", battery:81 }),
      W({ id:"C120", name:"Raju Shrestha", role:"Rebar Worker", co:"Subcon D Sdn Bhd (Civil)", zone:"Zone 2 · Pier P11", x:52, y:47, doc:"Passport ••••0937 (Nepal)", contact:"Wife · +977 98•-••• 223", battery:74 }),
      W({ id:"C131", name:"Hafiz Ismail", role:"Flagman", co:"Subcon D Sdn Bhd (Civil)", zone:"Zone 4 · Traffic diversion", x:66, y:34, doc:"IC ••••••-••-8853", contact:"Mother · +60 1•-••• 1027", battery:90 }),
      W({ id:"C140", name:"Aung Kyaw", role:"Surveyor Assistant", co:"Subcon F Sdn Bhd (Survey)", zone:"Zone 4 · CH 4+200", x:82, y:20, doc:"Passport ••••2283 (Myanmar)", contact:"Sister · +60 1•-••• 6604", battery:66 }),
      W({ id:"C150", name:"Siti Aminah", role:"Site Supervisor", co:"Gamuda", zone:"Zone 1 · Site office", x:12, y:88, doc:"IC ••••••-••-4410", contact:"Husband · +60 1•-••• 2290", battery:97 }),
      W({ id:"C118", name:"Dinesh Raj", role:"Welder", co:"Subcon E Sdn Bhd (Lifting)", zone:"Zone 3", x:34, y:66, status:"off", doc:"IC ••••••-••-7765", contact:"Wife · +60 1•-••• 9917", battery:4 })
    ]
  };
  const TYPES = {
    fall:   { title:"Fall detected", icon:I.warn, tone:"red" },
    sos:    { title:"SOS pressed", icon:I.sos, tone:"red" },
    nomove: { title:"No movement", icon:I.clock, tone:"orange" },
    heat:   { title:"High heat risk", icon:I.temp, tone:"red" }
  };
  const CHECKIN_SECONDS = 15, ESCALATE_SECONDS = 120;

  // ---------- state ----------
  let S, uid = 1;
  function freshState(){
    const now = Date.now();
    return {
      site:"building", tab:"alerts", level:"L3", sheet:null, emg:false, highlight:null, toast:null,
      resolved:{ building:3, infra:2 },
      alerts:[
        { id:uid++, site:"building", type:"fall", wid:"B023", t:now-35e3, status:"new" },
        { id:uid++, site:"building", type:"nomove", wid:"A017", t:now-20e3, status:"new", still:150 },
        { id:uid++, site:"infra", type:"heat", wid:"C112", t:now-50e3, status:"new" }
      ],
      log:[
        { t:now-20e3, site:"building", text:"No-movement alert: Rahim Uddin (A017). Check-in not answered, response team notified." },
        { t:now-50e3, site:"infra", text:"High heat risk: Mizanur Rahman (C112), rising for 20 min." },
        { t:now-35e3, site:"building", text:"Fall detected: Ahmad Razak (B023), Level 3 · Zone B." }
      ]
    };
  }
  S = freshState();

  // the seeded logs are listed newest first
  S.log.sort((a,b)=>b.t-a.t);

  // ---------- helpers ----------
  const $app = document.getElementById("app");
  const workers = () => WORKERS[S.site];
  const findW = (id) => WORKERS.building.concat(WORKERS.infra).find(w=>w.id===id);
  const siteAlerts = () => S.alerts.filter(a=>a.site===S.site && a.status!=="resolved");
  const activeCount = () => S.alerts.filter(a=>a.site===S.site && a.status!=="resolved" && a.status!=="checking").length;
  const initials = (n) => n.split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();
  const pad = (n) => String(n).padStart(2,"0");
  const clock = (t) => { const d=new Date(t); return pad(d.getHours())+":"+pad(d.getMinutes()); };
  const mmss = (s) => Math.floor(s/60)+":"+pad(Math.floor(s%60));
  const since = (t) => Math.max(0,(Date.now()-t)/1000);
  const where = (w) => w.level ? `Level ${w.level.slice(1)} · ${w.zone}` : w.zone;
  const loc = (w) => (w.level ? `Level ${w.level.slice(1)} · ${w.zone}` : w.zone) + ` · ${w.level ? SITES.building.locate : SITES.infra.locate}`;
  function addLog(text, site){ S.log.unshift({ t:Date.now(), site:site||S.site, text }); }
  function toast(msg){ S.toast = msg; clearTimeout(toast._t); toast._t = setTimeout(()=>{ S.toast=null; render(); }, 2800); }
  function setStatus(w){
    const open = S.alerts.some(a=>a.wid===w.id && a.status!=="resolved" && a.status!=="checking");
    if (w.status!=="off") w.status = open ? "alert" : "ok";
  }

  WORKERS.building.concat(WORKERS.infra).forEach(setStatus);

  // ---------- views ----------
  function header(){
    const n = activeCount();
    return `<header class="hdr ${S.site==="infra"?"infra":""}">
      <div class="hdr-top">
        <span class="brand">GAMUDA</span>
        <button class="bell" data-act="tab" data-tab="alerts" aria-label="${n} active alerts">${I.bell}${n?`<span class="badge">${n}</span>`:""}</button>
      </div>
      <span class="sub">${SITES[S.site].sub} · Supervisor</span>
      <div class="seg" role="group" aria-label="Project type">
        <button data-act="site" data-site="building" aria-pressed="${S.site==="building"}">Building &amp; Data Centre</button>
        <button data-act="site" data-site="infra" aria-pressed="${S.site==="infra"}">Infrastructure</button>
      </div>
    </header>`;
  }

  function alertCard(a){
    const w = findW(a.wid), T = TYPES[a.type], orange = T.tone==="orange";
    const age = `<span data-since="${a.t}">${mmss(since(a.t))}</span> ago`;
    let chip, extra = "", acts = "";
    if (a.status==="checking"){
      const left = Math.max(0, CHECKIN_SECONDS - Math.floor(since(a.t)));
      chip = `<span class="chip chk">Checking in</span>`;
      extra = `<div class="note warn">Clip is vibrating and asking ${w.name.split(" ")[0]} to respond · <span data-countdown="${a.t}">${left}</span>s left</div>`;
      acts = `<button class="btn grey" data-act="responded" data-id="${a.id}">Worker responded (cancel)</button>`;
    } else {
      chip = a.status==="new" ? `<span class="chip new">New</span>` : `<span class="chip ack">Acknowledged</span>`;
      if (a.type==="nomove") extra += `<div class="meta"><div>${I.info}<span>Still for <span data-still="${a.t}" data-base="${a.still||0}">${mmss((a.still||0)+0)}</span> · clip check-in not answered</span></div></div><div class="note warn">Response team notified</div>`;
      if (a.type==="heat") extra += `<div class="meta"><div>${I.info}<span>Rising for 20 min · open sun · body temp reading visible to Safety Officer only</span></div></div>`;
      if (a.type==="sos") extra += `<div class="meta"><div>${I.info}<span>Worker pressed the SOS button on the clip</span></div></div>`;
      if (a.status==="new" && since(a.t) >= ESCALATE_SECONDS) extra += `<div class="note esc">Not acknowledged in 2 min · escalated to Safety Officer</div>`;
      if (a.status==="ack") extra += `<div class="note ok">Acknowledged in ${mmss((a.ackAt-a.t)/1000)}${a.action?` · ${a.action}`:""}</div>`;
      if (a.status==="new"){
        acts = `<button class="btn primary" data-act="ack" data-id="${a.id}">Acknowledge</button>
                <button class="btn" data-act="emg" data-wid="${w.id}">Emergency info</button>
                <button class="btn icon" data-act="call" data-wid="${w.id}" aria-label="Call ${w.name}">${I.phone}</button>`;
      } else {
        const main = a.type==="heat" && !a.action
          ? `<button class="btn primary" data-act="rest" data-id="${a.id}">Send to rest &amp; water</button>`
          : `<button class="btn primary" data-act="resolve" data-id="${a.id}">Mark resolved</button>`;
        acts = main + `<button class="btn" data-act="emg" data-wid="${w.id}">Emergency info</button>
                <button class="btn icon" data-act="call" data-wid="${w.id}" aria-label="Call ${w.name}">${I.phone}</button>`;
      }
    }
    return `<article class="card ${orange?"orange":""} ${a.status==="checking"?"checking":""} ${a.status==="ack"?"ack":""} ${a.fresh?"flash":""}">
      <div class="row">
        <div class="ic ${orange?"orange":""}">${T.icon}</div>
        <div class="ttl"><strong class="${orange?"orange":""}">${a.status==="checking"?"Checking worker":T.title}</strong><span>${w.name} · ${w.id} · ${age}</span></div>
        ${chip}
      </div>
      <div class="meta"><div>${I.pin}<span>${loc(w)}</span></div><div>${I.users.replace(/width="22" height="22"/,'width="14" height="14"')}<span>${w.role} · ${w.co}</span></div></div>
      ${extra}
      <div class="actions">${acts}</div>
    </article>`;
  }

  function alertsView(){
    const list = siteAlerts().sort((a,b)=>b.t-a.t);
    const ws = workers();
    return `<div class="stats">
        <div class="stat hot"><b>${activeCount()}</b><span>Active alerts</span></div>
        <div class="stat"><b>${ws.filter(w=>w.status!=="off").length}/${ws.length}</b><span>Clips online</span></div>
        <div class="stat good"><b>${S.resolved[S.site]}</b><span>Resolved today</span></div>
      </div>
      <h2 class="h">Active alerts</h2>
      ${list.length ? list.map(alertCard).join("") : `<div class="empty">No active alerts. All clips reporting normally.</div>`}`;
  }

  function pinFor(w){
    const cls = w.status==="alert" ? "alert" : w.status==="off" ? "off" : w.heat==="high" ? "alert" : w.heat==="medium" ? "med" : "";
    return `<button class="pin ${cls} ${S.highlight===w.id?"hl":""}" style="left:${w.x}%;top:${w.y}%" data-act="sheet" data-wid="${w.id}" aria-label="${w.name}, ${w.id}">${w.id}</button>`;
  }

  function mapView(){
    if (S.site==="building"){
      const onLevel = workers().filter(w=>w.level===S.level);
      const alertZone = onLevel.find(w=>w.status==="alert");
      return `<div class="levels" role="group" aria-label="Level">
          ${["L1","L2","L3","L4"].map(l=>{
            const hot = workers().some(w=>w.level===l && w.status==="alert");
            return `<button data-act="level" data-level="${l}" aria-pressed="${S.level===l}">${l}${hot?" ●":""}</button>`;}).join("")}
        </div>
        <div class="map floor" aria-label="Floor plan level ${S.level.slice(1)}">
          <div class="room" style="left:4%;top:4%;width:44%;height:44%">Zone A</div>
          <div class="room" style="left:52%;top:4%;width:44%;height:44%">${S.level==="L2"?"Electrical Room":S.level==="L1"?"Loading Bay":"Zone C · Data Hall"}</div>
          <div class="room" style="left:4%;top:52%;width:44%;height:44%">${S.level==="L2"?"Chiller Room":S.level==="L1"?"Site Office":"Stair / Lift Core"}</div>
          <div class="room" style="left:52%;top:52%;width:44%;height:44%;${alertZone&&alertZone.y>50&&alertZone.x>50?"border-color:#C8202A;background:#FBE6E7":""}">Zone B · Data Hall</div>
          ${onLevel.map(pinFor).join("")}
        </div>
        <div class="legend"><span><i class="dot" style="background:var(--red)"></i>Alert</span><span><i class="dot" style="background:var(--blue)"></i>Normal</span><span class="small">Located by Bluetooth beacon on each floor</span></div>`;
    }
    return `<div class="map infra" aria-label="Live site map">
        <div class="road"><i></i></div>
        <div class="blob" style="left:2%;top:58%;width:120px;height:120px;background:rgba(214,40,40,.28)"></div>
        <div class="blob" style="left:26%;top:40%;width:110px;height:110px;background:rgba(240,140,30,.28)"></div>
        <div class="blob" style="left:56%;top:12%;width:110px;height:110px;background:rgba(240,200,40,.28)"></div>
        <div class="floatbox" style="left:12px;top:12px;display:flex;align-items:center;gap:8px;color:#B35500">${I.sun}<div style="display:flex;flex-direction:column;color:var(--ink)"><b style="font-size:16px">35°C</b><span style="font-size:11px;color:var(--ink-3)">Ambient · High heat</span></div></div>
        ${workers().map(pinFor).join("")}
        <span class="floatbox" style="right:12px;bottom:12px">GPS · live</span>
      </div>
      <div class="legend"><span><i class="dot" style="background:var(--red)"></i>High heat risk / alert</span><span><i class="dot" style="background:var(--orange)"></i>Medium</span><span><i class="dot" style="background:var(--blue)"></i>Normal</span><span><i class="dot" style="background:#8A9096"></i>Offline</span></div>`;
  }

  function workersView(){
    const rank = (w) => w.status==="alert"?0 : w.heat==="high"?1 : w.heat==="medium"?2 : w.status==="off"?4 : 3;
    const list = workers().slice().sort((a,b)=>rank(a)-rank(b));
    return `<h2 class="h">${list.length} workers on this site</h2>
      ${list.map(w=>{
        const st = w.status==="alert" ? `<span class="st alert">Alert</span>`
          : w.status==="off" ? `<span class="st off">Offline · ${w.battery}%</span>`
          : w.heat==="high" ? `<span class="st alert">Heat high</span>`
          : w.heat==="medium" ? `<span class="st med">Heat medium</span>` : `<span class="st ok">OK</span>`;
        return `<button class="wk" data-act="sheet" data-wid="${w.id}">
          <span class="av">${initials(w.name)}</span>
          <span class="ttl"><strong>${w.name}</strong><span>${w.id} · ${w.role} · ${w.level?`L${w.level.slice(1)} · `:""}${w.zone}</span></span>
          ${st}</button>`;}).join("")}`;
  }

  function logView(){
    const list = S.log.filter(l=>l.site===S.site);
    return `<h2 class="h">Event log · today</h2>
      <div class="log">${list.length?list.map(l=>`<div><time>${clock(l.t)}</time><span>${l.text}</span></div>`).join(""):`<div>No events yet.</div>`}</div>
      <p class="small">Every alert, acknowledgement, intervention and emergency-info access is recorded with a timestamp for incident reporting.</p>`;
  }

  function sheetView(){
    const w = findW(S.sheet); if (!w) return "";
    const open = S.alerts.find(a=>a.wid===w.id && a.status!=="resolved" && a.status!=="checking");
    return `<div class="scrim" data-act="close-bg">
      <section class="sheet" role="dialog" aria-modal="true" aria-label="${w.name}">
        <span class="grab"></span>
        <div class="row">
          <span class="av big">${initials(w.name)}</span>
          <div class="ttl"><strong style="color:var(--ink);font-size:19px">${w.name}</strong><span>${w.id} · ${w.role}</span></div>
          ${open?`<span class="chip new">${TYPES[open.type].title}</span>`:""}
        </div>
        <dl class="kv">
          <dt>Company</dt><dd>${w.co}</dd>
          <dt>Location</dt><dd>${loc(w)}</dd>
          <dt>Clip</dt><dd>${w.status==="off"?"Offline":"Online"} · battery ${w.battery}%</dd>
          <dt>Heat risk</dt><dd>${w.heat==="high"?"High":w.heat==="medium"?"Medium":"Normal"} <span class="small">(reading: Safety Officer only)</span></dd>
        </dl>
        ${S.emg ? `<div class="emg">
            <h3>Emergency info</h3>
            <dl class="kv">
              <dt>ID / passport</dt><dd>${w.doc}</dd>
              <dt>Emergency contact</dt><dd>${w.contact}</dd>
              <dt>Medical notes</dt><dd>${w.medical}</dd>
              <dt>Employer</dt><dd>${w.co}</dd>
            </dl>
            <span class="small">${I.check} Access logged at ${clock(Date.now())} · for emergency response only</span>
          </div>` : `<button class="btn" data-act="emg-open" data-wid="${w.id}">Show emergency info</button>`}
        <div class="actions">
          <button class="btn primary" data-act="call" data-wid="${w.id}">Call ${w.name.split(" ")[0]}</button>
          <button class="btn" data-act="locate" data-wid="${w.id}">Show on map</button>
        </div>
        <button class="btn grey" data-act="close">Close</button>
      </section>
    </div>`;
  }

  function nav(){
    const n = activeCount();
    const t = (id, label, icon, badge) => `<button data-act="tab" data-tab="${id}" ${S.tab===id?'aria-current="page"':""}>${icon}<span>${label}</span>${badge?`<span class="nb">${badge}</span>`:""}</button>`;
    return `<nav class="nav" aria-label="Sections">
      ${t("alerts","Alerts",I.alerts,n)}
      ${t("map",S.site==="building"?"Floor map":"Live map",I.map)}
      ${t("workers","Workers",I.users)}
      ${t("log","Log",I.log)}
    </nav>`;
  }

  function render(){
    const prev = $app.querySelector(".content");
    const keep = prev && prev.dataset.key === S.site+S.tab ? prev.scrollTop : 0;
    const body = S.tab==="alerts"?alertsView():S.tab==="map"?mapView():S.tab==="workers"?workersView():logView();
    $app.innerHTML = header()
      + `<div class="content" data-key="${S.site+S.tab}">${body}<p class="tag">Concept prototype · sample data</p></div>`
      + nav()
      + (S.sheet?sheetView():"")
      + (S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
    const c = $app.querySelector(".content"); if (c) c.scrollTop = keep;
    S.alerts.forEach(a=>{ a.fresh=false; });
  }

  // ---------- actions ----------
  function trigger(type){
    const busy = new Set(S.alerts.filter(a=>a.status!=="resolved").map(a=>a.wid));
    const pool = workers().filter(w=>w.status!=="off" && !busy.has(w.id));
    if (!pool.length){ toast("Every online worker already has an active alert."); render(); return; }
    const w = pool[Math.floor(Math.random()*pool.length)];
    const a = { id:uid++, site:S.site, type, wid:w.id, t:Date.now(), status: type==="nomove" ? "checking" : "new", fresh:true };
    if (type==="nomove") a.still = 120;
    if (type==="heat") w.heat = "high";
    S.alerts.push(a);
    if (type!=="nomove"){ setStatus(w); addLog(`${TYPES[type].title}: ${w.name} (${w.id}), ${where(w)}.`); }
    else addLog(`No movement for 2 min: ${w.name} (${w.id}). Clip check-in started.`);
    S.tab = "alerts"; S.sheet = null;
    if (w.level) S.level = w.level;
    render();
  }

  document.addEventListener("click", (e)=>{
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act, id = Number(el.dataset.id), wid = el.dataset.wid;
    const a = S.alerts.find(x=>x.id===id);
    if (act==="close-bg" && e.target!==el) return;
    switch(act){
      case "site": S.site = el.dataset.site; S.sheet=null; S.highlight=null; if (S.site==="building") S.level="L3"; break;
      case "tab": S.tab = el.dataset.tab; S.sheet=null; break;
      case "level": S.level = el.dataset.level; break;
      case "ack": a.status="ack"; a.ackAt=Date.now(); addLog(`Acknowledged ${TYPES[a.type].title.toLowerCase()} for ${findW(a.wid).name} in ${mmss((a.ackAt-a.t)/1000)}.`, a.site); break;
      case "rest": a.action="sent to rest & water"; addLog(`Intervention: ${findW(a.wid).name} sent to rest, shade and water.`, a.site); toast(`Instruction sent to ${findW(a.wid).name}'s clip and team lead.`); break;
      case "resolve": {
        a.status="resolved"; S.resolved[a.site]++; const w=findW(a.wid);
        if (a.type==="heat") w.heat="normal";
        setStatus(w); addLog(`Resolved: ${TYPES[a.type].title.toLowerCase()} for ${w.name} (${w.id}).`, a.site); toast("Alert closed and saved to the incident log."); break; }
      case "responded": { const w=findW(a.wid); S.alerts=S.alerts.filter(x=>x!==a); addLog(`Check-in answered by ${w.name} (${w.id}). No alert raised.`); toast(`${w.name.split(" ")[0]} responded. No alert sent.`); break; }
      case "call": { const w=findW(wid); addLog(`Supervisor called ${w.name} (${w.id}).`, w.level?"building":"infra"); toast(`Calling ${w.name}… (simulated)`); break; }
      case "emg": S.sheet=wid; S.emg=true; { const w=findW(wid); addLog(`Emergency info viewed for ${w.name} (${w.id}).`, w.level?"building":"infra"); } break;
      case "emg-open": S.emg=true; { const w=findW(wid); addLog(`Emergency info viewed for ${w.name} (${w.id}).`, w.level?"building":"infra"); } break;
      case "sheet": S.sheet=wid; S.emg=false; break;
      case "close": case "close-bg": S.sheet=null; S.emg=false; break;
      case "locate": { const w=findW(wid); S.tab="map"; S.highlight=wid; if (w.level) S.level=w.level; S.sheet=null; break; }
      case "demo": trigger(el.dataset.type); return;
      case "reset": location.reload(); return;
    }
    render();
  });
  document.addEventListener("keydown", (e)=>{ if (e.key==="Escape" && S.sheet){ S.sheet=null; S.emg=false; render(); } });

  // ---------- clock ----------
  setInterval(()=>{
    let changed = false;
    S.alerts.forEach(a=>{
      if (a.status==="checking" && since(a.t) >= CHECKIN_SECONDS){
        a.status="new"; a.t=Date.now(); a.still=120+CHECKIN_SECONDS; a.fresh=true; const w=findW(a.wid); setStatus(w);
        addLog(`No-movement alert: ${w.name} (${w.id}). Check-in not answered, response team notified.`, a.site); changed = true;
      }
      if (a.status==="new" && !a.escalated && since(a.t) >= ESCALATE_SECONDS){
        a.escalated = true; addLog(`Escalated to Safety Officer: ${TYPES[a.type].title.toLowerCase()} for ${findW(a.wid).name} not acknowledged in 2 min.`, a.site); changed = true;
      }
    });
    if (changed){ render(); return; }
    $app.querySelectorAll("[data-since]").forEach(n=>{ n.textContent = mmss(since(Number(n.dataset.since))); });
    $app.querySelectorAll("[data-countdown]").forEach(n=>{ n.textContent = Math.max(0, CHECKIN_SECONDS - Math.floor(since(Number(n.dataset.countdown)))); });
    $app.querySelectorAll("[data-still]").forEach(n=>{ n.textContent = mmss(Number(n.dataset.base) + since(Number(n.dataset.still))); });
  }, 1000);

  render();
})();
</script>
</body>
</html>
