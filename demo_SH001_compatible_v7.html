<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Helmet · Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#F4F3EF; --card:#FFFFFF; --ink:#16181D; --muted:#4B5160; --line:#DAD8D1; --soft:#E4E2DC;
    --green:#15803D; --green-bg:#DCFCE7; --green-ink:#14532D;
    --red:#B91C1C; --red-dark:#7F1D1D; --red-bg:#FEE2E2;
    --amber:#F59E0B; --amber-bg:#FEF3C7; --amber-ink:#92400E;
    --blue:#1D4ED8; --blue-bg:#DBEAFE; --blue-ink:#1E3A8A;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{background:#E2E0DA;color:var(--ink);font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  .main{display:block}.sub{display:block}

  /* ===== Presenter bar ===== */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
  .bar-title{font-size:16px;font-weight:700;margin-right:6px}
  .live{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft)}
  .live i{width:9px;height:9px;border-radius:50%;background:#9CA3AF}
  .live.on{background:var(--green-bg);color:var(--green-ink)} .live.on i{background:var(--green)}
  .bar .spacer{flex:1}
  .trig{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600}
  .trig svg{flex-shrink:0}
  .trig.ghost{background:none;border:1.5px solid var(--line)}
  .bar-hint{font-size:12px;color:var(--muted)}

  /* ===== Stage ===== */
  .stage{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:18px 24px 24px;width:max-content;margin:0 auto}
  .col{display:flex;flex-direction:column;gap:10px}
  .col-head{height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .who{font-size:15px;font-weight:700}
  .who small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  .seg{display:flex;background:var(--soft);border-radius:999px;padding:4px}
  .seg button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .phone{width:390px;height:800px;border-radius:42px;background:var(--ground);box-shadow:0 0 0 10px #16181D,0 20px 50px rgba(0,0,0,.18);
    overflow:hidden;position:relative;display:flex;flex-direction:column}
  .desk{width:620px;height:800px;border-radius:20px;background:var(--ground);box-shadow:0 0 0 8px #16181D,0 20px 50px rgba(0,0,0,.18);
    overflow:hidden;position:relative;display:flex;flex-direction:column}

  /* ===== Worker app (same look as the worker page) ===== */
  .w .screen{display:none;position:absolute;inset:0;flex-direction:column;overflow-y:auto;padding:18px}
  .w .screen.active{display:flex}
  .gap{display:flex;flex-direction:column;gap:14px;flex:1}
  .grow{flex:1}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand .main{font-size:18px;font-weight:700;line-height:1.15}
  .brand .sub{font-size:13px;color:var(--muted);line-height:1.15}
  .lang{display:flex;background:var(--soft);border-radius:999px;padding:4px}
  .lang button{height:36px;min-width:50px;border-radius:999px;font-size:14px;font-weight:600;padding:0 10px}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  .conn{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 14px}
  .conn-state{display:flex;align-items:center;gap:10px;min-width:0}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--green);flex-shrink:0}
  .conn .main{font-size:15px;font-weight:600;line-height:1.2}.conn .sub{color:var(--muted);font-size:12px;line-height:1.2}
  .conn-btn{height:44px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:600;flex-shrink:0;border:2px solid var(--red);color:var(--red);background:#fff}
  .w.off .conn-btn{background:var(--ink);border-color:var(--ink);color:#fff}
  .w.busy .conn-btn{opacity:.6;pointer-events:none}
  .w.off .dot{background:#9CA3AF}
  .w.busy .dot{background:var(--amber);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}

  .status{background:var(--green);color:#fff;border-radius:22px;padding:20px;display:flex;align-items:center;gap:16px}
  .status .ring{width:64px;height:64px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
  .status .main{font-size:30px;font-weight:700;line-height:1.1}
  .status .sub{font-size:17px;font-weight:500}
  .status .note{font-size:13px;opacity:.92;margin-top:4px;display:block}
  .w.off .status{background:#6B7280}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .tile .label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
  .tile .val{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .tile .sub{font-size:12px;color:var(--muted)}
  .tile.wide{grid-column:1 / -1}
  .tile.warn{outline:3px solid var(--amber)}
  .w.off .tile .val{color:#9CA3AF}

  .tip{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;line-height:1.25}
  .tip .main{font-size:15px;font-weight:600}.tip .sub{font-size:13px}
  .tip.blue{background:var(--blue-bg);color:var(--blue-ink)}
  .tip.redbg{background:var(--red-bg);color:var(--red-dark)}
  .tip.greenbg{background:var(--green-bg);color:var(--green-ink)}
  .tip.dark{background:rgba(0,0,0,.22);color:#fff}

  .btn{display:flex;align-items:center;justify-content:center;gap:14px;border-radius:22px;text-decoration:none;width:100%;flex-shrink:0}
  .btn .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
  .btn:active{transform:translateY(3px)}
  .sos{height:92px;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-dark)}
  .sos .main{font-size:26px;font-weight:700}.sos .sub{font-size:15px;font-weight:500}
  .outline{height:56px;border:2px solid currentColor;border-radius:18px}
  .outline .main{font-size:17px;font-weight:600}.outline .sub{font-size:13px;opacity:.85}
  .outline .main,.outline .sub{display:inline}

  #wFall{background:var(--red);color:#fff}
  .pill{display:flex;align-items:center;gap:8px;align-self:center;background:rgba(0,0,0,.22);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600}
  .pill .main,.pill .sub{display:inline}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
  .q .main{font-size:34px;font-weight:700;line-height:1.15}.q .sub{font-size:20px;font-weight:500}
  .count{position:relative;width:190px;height:190px;align-self:center;flex-shrink:0}
  .count svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .count .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .count .n{font-size:84px;font-weight:700}
  .count small{font-size:14px;font-weight:500;margin-top:4px}
  .white-outline{height:64px;border:2px solid #fff;border-radius:20px}
  .white-outline .main{font-size:20px;font-weight:700}.white-outline .sub{font-size:14px}
  .white-outline .main,.white-outline .sub{display:inline}

  #wHeat{background:#FFF7ED;padding:0}
  .heat-top{background:var(--amber);padding:26px 20px 22px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:14px}
  .heat-top .title .main{font-size:34px;font-weight:700;line-height:1.1}
  .heat-top .title .sub{font-size:19px;font-weight:600}
  .reading{display:flex;align-items:flex-end;justify-content:space-between;background:rgba(255,255,255,.55);border-radius:18px;padding:12px 16px;gap:10px}
  .reading .big{font-size:40px;font-weight:700;line-height:1;white-space:nowrap}
  .reading .temp{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
  .reading .sim{font-size:12px;font-weight:600;margin-top:4px}
  .heat-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .h2{font-size:18px;font-weight:700}
  .step{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:12px 14px}
  .step .k{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .step .main{font-size:19px;font-weight:700;line-height:1.2}.step .sub{font-size:14px;color:var(--muted)}
  .rest{height:72px;background:var(--ink);color:#fff;box-shadow:0 5px 0 #000}
  .rest .main{font-size:22px;font-weight:700}.rest .sub{font-size:14px}

  #wHelp{background:var(--ink);color:#fff}
  .help-icon{width:120px;height:120px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;align-self:center;margin-top:40px;flex-shrink:0;transition:background .3s}
  #wHelp.coming .help-icon{background:var(--green)}
  .help-txt .main{font-size:32px;font-weight:700;line-height:1.15}.help-txt .sub{font-size:19px}
  .help-note{font-size:15px;opacity:.9}
  .light-btn{height:64px;background:#fff;color:var(--ink);border-radius:20px}
  .light-btn .main{font-size:20px;font-weight:700}.light-btn .sub{font-size:14px}
  .light-btn .main,.light-btn .sub{display:inline}
  .foot{font-size:11px;color:var(--muted);text-align:center;margin:6px 0 0}
  #wHelp .foot{color:rgba(255,255,255,.8)}

  /* ===== Supervisor + EHS (same look as the worker app) ===== */
  .s-scroll{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .bell{position:relative;width:48px;height:48px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bell b{position:absolute;top:4px;right:4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .crew{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px}
  .crew .main{font-size:15px;font-weight:600;line-height:1.2}.crew .sub{font-size:12px;color:var(--muted);line-height:1.2}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .stat b{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
  .stat.hot{background:var(--red-bg)} .stat.hot b{color:var(--red)} .stat.hot span{color:var(--red-dark)}
  .stat.warm{background:var(--amber-bg)} .stat.warm b,.stat.warm span{color:var(--amber-ink)}
  .stat.good b{color:var(--green)}
  .sec{font-size:13px;font-weight:700;color:var(--muted);margin:2px 2px -4px}
  .clear{background:#fff;border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .clear .ok{width:56px;height:56px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center}
  .clear .main{font-size:18px;font-weight:700}.clear .sub{font-size:13px;color:var(--muted)}

  .acard{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;outline:3px solid var(--red)}
  .acard.amber{outline-color:var(--amber)}
  .acard.pending{outline:3px dashed var(--red)}
  .acard.ack{outline:2px solid var(--line)}
  .acard.flash{animation:flash .9s ease 3}
  @keyframes flash{50%{box-shadow:0 0 0 8px rgba(185,28,28,.25)}}
  .arow{display:flex;align-items:center;gap:12px}
  .aic{width:46px;height:46px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .acard.heat .aic{background:var(--amber)}
  .att{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
  .att b{font-size:20px;font-weight:700;color:var(--red)}
  .acard.amber .att b{color:var(--amber-ink)}
  .acard.ack .att b{color:var(--ink)}
  .att span{font-size:14px;color:var(--muted)}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:1px}
  .tag.live{background:var(--ink);color:#fff}
  .tag.sim{background:var(--soft);color:var(--muted)}
  .chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;align-self:flex-start}
  .chip.new{background:var(--red-bg);color:var(--red-dark)}
  .chip.ack{background:var(--green-bg);color:var(--green-ink)}
  .chip.chk{background:var(--amber-bg);color:var(--amber-ink)}
  .ameta{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink)}
  .ameta div{display:flex;align-items:center;gap:8px}
  .ameta svg{flex-shrink:0}
  .note{border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.25}
  .note.warn{background:var(--amber-bg);color:var(--amber-ink)}
  .note.esc{background:var(--red-bg);color:var(--red-dark)}
  .note.ok{background:var(--green-bg);color:var(--green-ink)}
  .acts{display:flex;gap:8px}
  .sbtn{flex:1;height:52px;border-radius:16px;font-size:15px;white-space:nowrap;padding:0 10px;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none}
  .sbtn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-dark)}
  .sbtn.dark{background:var(--ink);color:#fff;box-shadow:0 4px 0 #000}
  .sbtn.icon{flex:none;width:52px}
  .sbtn:active{transform:translateY(2px)}

  .floor{position:relative;height:124px;border-radius:14px;background:#F8F7F3;border:1px solid var(--line);overflow:hidden}
  .floor.big{height:340px}
  .room{position:absolute;border:2px solid #CFCCC3;border-radius:6px;font-size:11px;font-weight:600;color:var(--muted);padding:3px 6px}
  .pin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#6B7280;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .pin.ok{background:var(--green)}
  .pin.alert{background:var(--red);width:22px;height:22px;margin:-11px 0 0 -11px;animation:pulse 1.4s infinite}
  .pin.warm{background:var(--amber);width:22px;height:22px;margin:-11px 0 0 -11px;animation:pulsea 1.4s infinite}
  .pin.off{background:#9CA3AF}
  .pin-label{position:absolute;transform:translate(-50%,12px);font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;white-space:nowrap}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,28,28,.55)}100%{box-shadow:0 0 0 16px rgba(185,28,28,0)}}
  @keyframes pulsea{0%{box-shadow:0 0 0 0 rgba(245,158,11,.6)}100%{box-shadow:0 0 0 16px rgba(245,158,11,0)}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

  .wk{background:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .av{width:44px;height:44px;border-radius:50%;background:var(--soft);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wk .att b{font-size:16px;color:var(--ink)}
  .wk .att span{font-size:12px}
  .wk .temp{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
  .wk .temp small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}
  .st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
  .st.ok{background:var(--green-bg);color:var(--green-ink)} .st.alert{background:var(--red-bg);color:var(--red-dark)}
  .st.warm{background:var(--amber-bg);color:var(--amber-ink)} .st.off{background:var(--soft);color:var(--muted)}

  .log{background:#fff;border-radius:18px;padding:4px 14px}
  .log div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.3}
  .log div:last-child{border-bottom:none}
  .log time{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;width:44px;font-weight:600}
  .log .r{color:var(--red)} .log .a{color:var(--amber-ink)} .log .g{color:var(--green-ink)}

  .nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 6px 12px;flex-shrink:0}
  .nav button{flex:1;height:58px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;border-radius:14px}
  .nav button[aria-current="page"]{color:var(--ink);background:var(--soft)}
  .nav .nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  .scrim{position:absolute;inset:0;background:rgba(22,24,29,.45);display:flex;align-items:flex-end;z-index:5}
  .sheet .sbtn{flex:none;height:52px}
  .sheet{background:var(--ground);width:100%;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:14px 18px 22px;display:flex;flex-direction:column;gap:12px}
  .grab{width:44px;height:5px;border-radius:3px;background:#C9C6BD;align-self:center}
  .kv{background:#fff;border-radius:18px;padding:6px 14px}
  .kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv div:last-child{border-bottom:none}
  .kv dt{color:var(--muted);font-weight:600} .kv dd{margin:0;text-align:right;font-weight:600}

  .bars{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .brow{display:grid;grid-template-columns:150px minmax(0,1fr) 62px;align-items:center;gap:10px;font-size:13px}
  .brow .nm{font-weight:600;line-height:1.15}
  .brow .nm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .track{height:12px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--green)}
  .fill.warm{background:var(--amber)} .fill.hot{background:var(--red)}
  .brow b{text-align:right;font-variant-numeric:tabular-nums}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .toast{position:absolute;left:16px;right:16px;top:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;z-index:6}
  /* ===== Connect-first screen ===== */
  .pair-art{position:relative;width:200px;height:200px;align-self:center;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .pair-icon{width:140px;height:140px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
  .wave{position:absolute;inset:30px;border-radius:50%;border:3px solid var(--amber);opacity:0}
  .w.busy .wave{animation:ripple 1.6s ease-out infinite} .w.busy .w2{animation-delay:.8s}

  /* ===== Highway site maps ===== */

  .maps2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .callout{display:flex;gap:10px;align-items:center;background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.3}
  .focus{background:#fff;border-radius:18px;outline:3px solid var(--red);padding:12px 14px;display:flex;flex-direction:column;gap:10px}

  /* ===== EHS control centre ===== */
  .desk{width:1010px}
  .ehs{display:flex;height:100%;min-height:0}
  .side{width:200px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:18px 12px}
  .side .brand{padding:0 4px 14px}
  .side .brand .main{font-size:16px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);text-align:left;position:relative}

  .side-foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.35;padding:0 6px}
  .ehs-main{flex:1;min-width:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .ehs-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .ehs-head h1{margin:0;font-size:26px;font-weight:700;line-height:1.1}
  .ehs-head h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .mchip{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:#fff;font-size:12px;font-weight:600}
  .mchip.sim{background:var(--amber-bg);color:var(--amber-ink)}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .kpi span{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
  .kpi b{font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .kpi small{font-size:11px;color:var(--muted)}
  .kpi.hot{background:var(--red-bg)} .kpi.hot b{color:var(--red)}
  .kpi.warm{background:var(--amber-bg)} .kpi.warm b{color:var(--amber-ink)}
  .rowg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px}
  .pnl{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .pnl-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

  .lnk{font-size:13px;font-weight:700;color:var(--blue)}
  .tblwrap{overflow:auto;max-height:520px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
  .tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.liverow td{background:#FFF7ED}
  .tbl .mono{font-variant-numeric:tabular-nums}
  .st.blue{background:var(--blue-bg);color:var(--blue-ink)}
  .search{height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:14px;background:var(--ground);width:250px}
  .act{height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
  .act.light{background:var(--soft);color:var(--ink)}
  .hmap{position:relative;height:250px;border-radius:14px;background:#F8F7F3;border:1px solid var(--line);overflow:hidden}
  .hmap .z{position:absolute;border:2px dashed #D6D3CA;border-radius:10px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 7px}
  .hmap .d{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%}
  .hmap .pin,.hmap .pin-label{z-index:2}
  .donut-wrap{display:flex;align-items:center;gap:16px}
  .donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;position:relative}
  .donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff}
  .donut div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;line-height:1}
  .donut b{font-size:24px}.donut small{font-size:11px;color:var(--muted);margin-top:3px}
  .leg{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .leg span{display:flex;align-items:center;gap:8px}
  .leg i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .hbars{display:flex;flex-direction:column;gap:9px}
  .hbar{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;align-items:center;gap:8px;font-size:13px}
  .hbar b{text-align:right;font-variant-numeric:tabular-nums}
  .warnbox{background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4}
  .explain{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
  .chart svg{width:100%;height:auto;display:block}
  .cleg{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .cleg span{display:flex;align-items:center;gap:6px}
  .cleg i{width:14px;height:4px;border-radius:2px}
  .bullet{background:var(--ground);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4}
  .bullet b{display:block;font-size:14px;margin-bottom:2px}
  .seg2{display:flex;background:var(--soft);border-radius:999px;padding:3px}
  .seg2 button{height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600}
  .seg2 button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .rcard{background:var(--ground);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .rcard b{display:block;font-size:16px}.rcard p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  /* ===== High-risk zone (unauthorised entry) ===== */
  #wZone{background:var(--red);color:#fff;animation:zflash 1s steps(2,end) infinite}
  @keyframes zflash{50%{background:#8E1414}}
  .zq .main{font-size:28px;font-weight:700;line-height:1.15}.zq .sub{font-size:17px;font-weight:500}
  .zbox{background:rgba(255,255,255,.16);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.3}
  .zbox b{font-size:16px}
  .zdo{background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;line-height:1.2}
  .zdo .main{font-size:21px;font-weight:700}.zdo .sub{font-size:13px;color:var(--muted)}
  .led{width:14px;height:14px;border-radius:50%;background:#FF5A5A;flex-shrink:0;box-shadow:0 0 0 4px rgba(255,90,90,.35),0 0 14px #FF5A5A;animation:blink .5s steps(2,end) infinite}
  #wZone .light-btn{color:var(--red);box-shadow:0 5px 0 var(--red-dark)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ===== Asset pool (HQ QSHE) ===== */
  .side nav button .lk{margin-left:auto;font-size:10px;font-weight:700;background:var(--amber);color:var(--ink);border-radius:999px;padding:2px 7px}
  .role-note{background:var(--ground);border-radius:12px;padding:10px;font-size:12px;line-height:1.4;color:var(--muted);margin-top:12px}
  .role-note b{color:var(--ink)}
  .mchip.who{background:var(--ink);color:#fff}
  .mchip.who.site{background:var(--blue-bg);color:var(--blue-ink)}
  .access{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4}
  .tag{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:3px 8px;flex-shrink:0}
  .tag.amber{background:var(--amber-bg);color:var(--amber-ink)} .tag.blue{background:var(--blue-bg);color:var(--blue-ink)} .tag.red{background:var(--red-bg);color:var(--red-dark)}
  .todo{background:var(--ink);color:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .todo-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .todo-h b{font-size:16px}.todo-h span{font-size:12px;color:#C9CCD3}
  .todos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .td{background:#262A31;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:7px}
  .td .t{align-self:flex-start}
  .td b{font-size:14px;line-height:1.3}
  .td p{margin:0;font-size:12px;color:#C9CCD3;line-height:1.4}
  .td button{margin-top:auto;height:40px;border-radius:10px;background:#fff;color:var(--ink);font-size:13px;font-weight:700}
  .td .ok{margin-top:auto;height:40px;border-radius:10px;background:var(--green);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px}
  .ubar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--soft);vertical-align:middle;margin-right:6px;overflow:hidden}
  .ubar i{display:block;height:6px}
  .ages{display:flex;flex-direction:column;gap:10px}
  .age .r{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .age .b{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;margin:4px 0 2px}.age .b i{display:block;height:9px}
  .age small{font-size:12px;color:var(--muted)}
  .rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .rule{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.4}
  .rule .h{display:flex;justify-content:space-between;gap:6px;align-items:center}
  .rule .h b{font-size:13px}
  .rule small{color:var(--muted)}
  .workload{background:var(--red-bg);color:var(--red-dark);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
  .workload b{font-size:14px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>

<!-- ============ Presenter bar (what you click during the presentation) ============ -->
<header class="bar">
  <span class="bar-title">Smart Helmet · Live demo</span>
  <span class="live" id="liveChip"><i></i><span id="liveTxt">Helmet not connected</span></span>
  <span class="spacer"></span>
  <span class="bar-hint" id="barHint">Trigger an event:</span>
  <button type="button" class="trig" data-trigger="fall">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>Fall</button>
  <button type="button" class="trig" data-trigger="heat">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>Heat</button>
  <button type="button" class="trig" data-trigger="sos">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>SOS</button>
  <button type="button" class="trig" data-trigger="zone">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Zone entry</button>
  <button type="button" class="trig" id="btnOff" title="Dummy data: a crew helmet is dropped, not a fall">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18"/><path d="M4 17a8 8 0 0 1 16 0"/><path d="M4 4l16 16"/></svg>Helmet off</button>
  <button type="button" class="trig ghost" id="btnSim" title="Backup if the real helmet won't connect">Simulate helmet</button>
  <button type="button" class="trig ghost" id="btnReset">Reset</button>
</header>

<div class="stage" id="stage">

  <!-- ===================== LEFT: WORKER ===================== -->
  <div class="col">
    <div class="col-head"><span class="who">Worker's view<small>Ahmad Razak · wearing the live helmet</small></span></div>
    <div class="phone w" id="worker">

      <!-- Connect helmet (first screen) -->
      <section class="screen active" id="wPair" aria-label="Connect helmet">
        <div class="gap">
          <div class="top">
            <div class="brand">
              <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18"/><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 9V5"/><path d="M9 6.5v3"/><path d="M15 6.5v3"/></svg></div>
              <div><span class="main" data-m="app"></span><span class="sub" data-s="app"></span></div>
            </div>
            <div class="lang" role="group" aria-label="Language">
              <button type="button" data-lang="bn" aria-pressed="false">বাংলা</button>
              <button type="button" data-lang="en" aria-pressed="true">EN</button>
            </div>
          </div>
          <div class="grow"></div>
          <div class="pair-art" aria-hidden="true">
            <span class="wave w1"></span><span class="wave w2"></span>
            <div class="pair-icon"><svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18"/><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 9V5"/><path d="M9 6.5v3"/><path d="M15 6.5v3"/></svg></div>
          </div>
          <div class="center q"><span class="main" data-m="pairTitle"></span><span class="sub" data-s="pairTitle"></span></div>
          <div class="center" style="color:var(--muted)"><span style="font-size:16px" data-m="pairHint"></span><span style="font-size:14px" data-s="pairHint"></span></div>
          <div class="grow"></div>
          <button type="button" class="btn pair-btn" id="btnPair">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
            <span class="txt"><span class="main" id="pairMain"></span><span class="sub" id="pairSub"></span></span>
          </button>
          <p class="foot" data-m="foot"></p>
        </div>
      </section>

      <!-- Home -->
      <section class="screen" id="wHome" aria-label="Worker home">
        <div class="gap">
          <div class="top">
            <div class="brand">
              <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18"/><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 9V5"/><path d="M9 6.5v3"/><path d="M15 6.5v3"/></svg></div>
              <div><span class="main" data-m="app"></span><span class="sub" data-s="app"></span></div>
            </div>
            <div class="lang" role="group" aria-label="Language">
              <button type="button" data-lang="bn" aria-pressed="false">বাংলা</button>
              <button type="button" data-lang="en" aria-pressed="true">EN</button>
            </div>
          </div>

          <div class="conn" role="status" aria-live="polite">
            <div class="conn-state"><span class="dot" aria-hidden="true"></span>
              <div><span class="main" id="connMain"></span><span class="sub" id="connSub"></span></div></div>
            <button type="button" class="conn-btn" id="btnConn"></button>
          </div>

          <div class="status" role="status">
            <div class="ring" id="statusIcon"></div>
            <div><span class="main" id="statusMain"></span><span class="sub" id="statusSub"></span><span class="note" id="statusNote"></span></div>
          </div>

          <div class="grid">
            <div class="tile">
              <div class="label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg><span data-m="air"></span></div>
              <span class="val" id="vAir">--</span><span class="sub" data-s="air"></span>
            </div>
            <div class="tile">
              <div class="label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg><span data-m="hum"></span></div>
              <span class="val" id="vHum">--</span><span class="sub" data-s="hum"></span>
            </div>
            <div class="tile" id="tSkin">
              <div class="label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg><span data-m="skin"></span></div>
              <span class="val" id="vSkin">--</span><span class="sub" data-s="skin"></span>

/* Demo uses the existing fixed worker/site coordinates. No browser geolocation. */
async function connectHelmet(){
  if (S.conn !== "off") return;
  if (!navigator.bluetooth) { barMsg("Bluetooth needs Chrome or Edge on a laptop. Or use Simulate helmet."); return; }
  S.conn = "busy"; renderAll();
  try {
    bleDev = await navigator.bluetooth.requestDevice({ filters:[{ namePrefix: CONFIG.bleNamePrefix }], optionalServices:[BLE.service] });
    bleDev.addEventListener("gattserverdisconnected", () => { if (S.conn === "on") { setConn("off"); barMsg("Helmet disconnected. Click Connect helmet to reconnect."); } });
    const server = await bleDev.gatt.connect();
    const svc = await server.getPrimaryService(BLE.service);
    const rx = await svc.getCharacteristic(BLE.fromHelmet);
    bleTx = await svc.getCharacteristic(BLE.toHelmet);
    rx.addEventListener("characteristicvaluechanged", e => onHelmetData(new TextDecoder().decode(e.target.value)));
    await rx.startNotifications();
    S.real = true; S.realHr = false; S.heatArmed = true; S.hrHighSince = 0;
    setConn("on");
    await bleTx.writeValue(new TextEncoder().encode("HELLO"));   // firmware starts monitoring only after HELLO
    helmetSend("ZONE_OFF");
  } catch (err) {
    S.conn = "off"; bleTx = null; renderAll();
    if (err && err.name !== "NotFoundError") barMsg("Could not connect: " + (err.message || err) + ". Try again, or use Simulate helmet.");
  }
}
function disconnectHelmet(){
  helmetSend("ZONE_OFF");
  try { if (bleDev && bleDev.gatt.connected) bleDev.gatt.disconnect(); } catch(e) {}
  setConn("off");
}
/* Website → helmet: HELLO (start monitoring), ZONE_ON (buzzer + red LED), ZONE_OFF */
let bleQueue = Promise.resolve();
function helmetSend(cmd){
  if (!bleTx) return;
  const tx = bleTx;   // queue writes: Web Bluetooth refuses two writes at the same time
  bleQueue = bleQueue.then(() => tx.writeValue(new TextEncoder().encode(cmd))).catch(() => {});
}
/* Helmet → website (firmware V8.3), one message per Bluetooth packet:
   HELLO_IPHONE        monitoring started
   BODY,obj,amb        GY-906 surface (skin) temperature + sensor ambient, every 2 s   ("NA" if invalid)
   ENV,temp,hum        BME280 air temperature + humidity, at start then every 5 min
   ACC,g               total acceleration, every 1 s
   FALL,id,peakG       impact >= 2.2 g  -> "Did you fall?" countdown starts
   ESC,id              helmet alarm escalated (5 s, no response)
   ACK,id              worker held the helmet button 2 s = "I'm OK" -> fall cancelled
   END,id              no response after 10 s -> fall alert sent to supervisor; buzzer persists
   TEMP_ALERT,t        body temperature over the limit for the set time (helmet beeps too)
   TEMP_CLEAR          body temperature back below the limit
   SOS                 button held 2 s with no fall alarm running
   PAUSE / RESUME      short button press (bench-test pause)                           */
function onHelmetData(chunk){
  chunk.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(handleHelmetLine);
}
function handleHelmetLine(line){
  if (S.conn !== "on") return;
  const p = line.split(","), k = p[0], n = v => (v === undefined || v === "NA") ? NaN : parseFloat(v);
  if (k === "BODY") {
    const skin = n(p[1]);
    if (!isNaN(skin)) S.skin = skin;
    checkHeat();
  }
  if (k === "ENV") {
    const t = n(p[1]), h = n(p[2]);
    if (!isNaN(t)) S.air = t;
    if (!isNaN(h)) S.hum = h;
  }
  if (k === "ACC") S.accG = n(p[1]);
  if (k === "FALL") { helmetEvent("fall", true); addLog("r", "Helmet impact " + (p[2] || "") + " g · checking on worker"); }
  if (k === "ACK") {
    const f = S.alerts.find(a => a.type === "fall" && a.status !== "resolved");
    if (f && f.status === "pending") cancelFall();
    else if (f) resolve(f.id);
  }
  if (k === "ALARM_ACK") {
    const type = (p[1] || "").toLowerCase();
    const a = S.alerts.find(x => x.type === type && x.status !== "resolved");
    if (a) resolve(a.id);
  }
  if (k === "END") confirmFall();
  if (k === "TEMP_CLEAR") {
    // Firmware confirms 3 continuous seconds below 38C. Clear the
    // displayed supervisor heat incident as well as the local buzzer.
    const activeHeat = S.alerts.find(a => a.type === "heat" && a.status !== "resolved");
    if (activeHeat) resolve(activeHeat.id);
    S.heatArmed = true;
    addLog("g", "Heat recovered · below 38°C for 3 seconds");
    renderAll();
  }
  if (k === "TEMP_ALERT") {
    const t = n(p[1]); if (!isNaN(t)) S.skin = t;
    // firmware repeats TEMP_ALERT every 2 s; only open a new alert after the sensor has cooled (re-armed)
    if (S.heatArmed && !S.alerts.some(a => a.type === "heat" && a.status !== "resolved")) { S.heatArmed = false; helmetEvent("heat", true); }
  }
  if (k === "SOS") helmetEvent("sos", true);
  if (k === "HELLO_IPHONE") barMsg("Helmet monitoring started · live readings on");
  if (k === "PAUSE") barMsg("Helmet button: monitoring paused. Press the helmet button once to resume.");
  if (k === "RESUME") barMsg("Helmet monitoring resumed");
  if (k === "BODY" || k === "ENV") {
    renderWorker();
    if (S.supTab === "workers" || S.supTab === "map" || S.rightView === "ehs") renderRight();
  }
}
/* Worker held the helmet button during the fall check: he is OK, so no alert goes out */

  if (!a) return;
  a.status = "resolved";

function checkHeat(){

  if (!S.real && S.skin < CONFIG.heatRearmC) S.heatArmed = true; // real helmet uses TEMP_CLEAR

function liveStatus(){
  if (S.conn !== "on") return { cls:"off", label:"Offline" };

  if (a.some(x => x.type !== "heat")) return { cls:"alert", label:"Alert" };

}

const HW_TREES = (() => {
  let out = "", seed = 7;
  const r = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 0; i < 70; i++) {
    const x = r() * 400, y = r() * 310, rad = 5 + r() * 6, c = r() > .5 ? "#5E8C3A" : "#6E9C45";
    if (Math.abs(y - (300 - (x + 30) * 0.78)) < 70) continue;   // keep trees off the road
    out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${c}" opacity=".9"/>`;
  }
  return out;
})();

function alertCard(a){
  const T2 = TYPES[a.type];
  const amber = T2.tone === "amber";
  const cls = a.status === "pending" ? "pending" : a.status === "ack" ? "ack" : (amber && !a.asked ? "amber" : "");
  const icon = a.type === "heat" ? P.temp : a.type === "sos" ? P.sos : a.type === "zone" ? P.ban : P.warn;
  const title = a.status === "pending" ? "Possible fall" : (a.type === "heat" && a.asked ? "Heat · asked for help" : T2.title);
  let chip, notes = "", acts = "";
  if (a.status === "pending") {
    chip = `<span class="chip chk">Confirming</span>`;
    notes = `<div class="note warn">Helmet detected a fall. Alert confirms in ${a.left} s unless help is sent sooner.</div>`;
  } else {
    chip = a.status === "new" ? `<span class="chip new">New · ${mmss(since(a.t))}</span>` : `<span class="chip ack">Acknowledged</span>`;
    if (a.type === "heat") notes += `<div class="note warn">Skin ${S.skin.toFixed(1)}°C · heart rate ${Math.round(S.hr)} bpm (limit ${HR_LIMIT}) · air ${S.air.toFixed(1)}°C · ${S.real ? "live helmet" : "simulated"}</div>`;
    if (a.type === "zone" && a.status === "new") notes += `<div class="note esc">Not on ${ZONE.ptw} · clip is beeping · worker told to leave</div>`;
    if (a.type === "zone") notes += `<div class="note warn">Inside the zone for ${mmss(since(a.t))} · heart rate ${Math.round(S.hr)} bpm</div>`;
    if (a.resting) notes += `<div class="note ok">Worker tapped "I'm resting now" at ${clock(a.resting)}</div>`;
    if (a.type === "sos") notes += `<div class="note esc">Worker pressed SOS on the helmet</div>`;
    if (a.status === "new" && since(a.t) >= CONFIG.escalateSeconds) notes += `<div class="note esc">Not acknowledged in 2 min · escalated to EHS</div>`;
    if (a.status === "ack") notes += `<div class="note ok">You acknowledged in ${mmss((a.ackAt - a.t)/1000)} · worker has been told</div>`;
    acts = `<div class="acts">
      ${a.status === "new"
        ? `<button type="button" class="sbtn primary" data-act="ack" data-id="${a.id}">${a.type==="heat" && !a.asked ? "Acknowledge" : "On my way"}</button>`
        : `<button type="button" class="sbtn dark" data-act="resolve" data-id="${a.id}">Mark resolved</button>`}

      <a class="sbtn icon" href="tel:${CONFIG.supervisorPhone}" aria-label="Call Ahmad">${ic(P.phone,22)}</a>
    </div>`;
  }
  return `<article class="acard ${cls} ${a.type === "heat" ? "heat" : ""} ${a.status==="new" && since(a.t) < 4 ? "flash" : ""}">
    <div class="arow">
      <div class="aic">${ic(icon,24,"#fff",2.4)}</div>
      <div class="att"><b>${title}</b><span>Ahmad Razak · ${LIVE.id} <span class="tag live">LIVE</span></span></div>
      ${chip}
    </div>
    <div class="ameta">
      <div>${ic(P.pin,16)} ${a.type === "zone" ? `${ZONE.ptw} zone · ${ZONE.work} · ${ZONE.place}` : LIVE.zone + " · helmet GPS"}</div>
      <div>${ic(P.user,16)} ${LIVE.role} · ${LIVE.co}</div>

    ${notes}${acts}
  </article>`;
}

function donut(parts, total, label) {
  let acc = 0;
  const stops = parts.filter(p => p.n > 0).map(p => { const a = acc; acc += p.n / total * 100; return `${p.c} ${a}% ${acc}%`; }).join(",");
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div><b>${total}</b><small>${label}</small></div></div>

}

function lineChart(data) {
  const W = 760, H = 230, x0 = 40, y0 = 14, w = 670, h = 170;
  const X = i => x0 + i * w / (data.length - 1);
  const Yt = v => y0 + h - (v - 24) / 16 * h, Yr = v => y0 + h - (v - 50) / 40 * h;
  let g = "";
  for (let i = 0; i < 5; i++) {
    const y = y0 + i * h / 4;
    g += `<line x1="${x0}" y1="${y}" x2="${x0 + w}" y2="${y}" stroke="#E4E2DC"/><text x="6" y="${y + 4}" fill="#4B5160" font-size="11">${40 - i * 4}°</text><text x="${x0 + w + 8}" y="${y + 4}" fill="#4B5160" font-size="11">${90 - i * 10}%</text>`;
  }
  const ticks = data.map((v, i) => `<text x="${X(i)}" y="${y0 + h + 20}" text-anchor="middle" fill="#4B5160" font-size="11">${v.k}</text>`).join("");
  const pt = data.map((v, i) => `<circle cx="${X(i)}" cy="${Yt(v.t)}" r="3.5" fill="#B91C1C"/>`).join("");
  const path = f => data.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + f(v).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Simulated temperature and humidity trend">${g}${ticks}
    <path d="${path(v => Yt(v.t))}" stroke="#B91C1C" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <path d="${path(v => Yr(v.rh))}" stroke="#1D4ED8" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>${pt}</svg>`;
}
function zoneChart() {
  const base = 196, maxh = 150;
  const bars = CLIMATE_ZONES.map((z, i) => {
    const b = (z.t - 26) / 14 * maxh, x = 30 + i * 74, c = z.t >= 35 ? COLORS.alert : z.t >= 34 ? "#C2410C" : z.t >= 33 ? COLORS.warm : COLORS.ok;
    return `<rect x="${x}" y="${base - b}" width="44" height="${b}" rx="6" fill="${c}"/><text x="${x + 22}" y="${base - b - 8}" font-size="12" text-anchor="middle" font-weight="700" fill="#16181D">${z.t.toFixed(1)}°</text>
      <text x="${x + 22}" y="${base + 18}" font-size="10" text-anchor="middle" fill="#4B5160">${z.short}</text>`;
  }).join("");
  return `<svg viewBox="0 0 470 230" role="img" aria-label="Simulated ambient temperature by zone"><line x1="20" y1="${base}" x2="460" y2="${base}" stroke="#DAD8D1"/>${bars}</svg>`;
}

function downloadCSV(type) {
  const W = ehsWorkers(), A = ehsAlerts();
  const rows = type === "workers"
    ? [["Worker ID", "Name", "Helmet ID", "Subcon", "Zone", "Condition", "Skin temp C", "Heart rate bpm", "Ambient temp C"], ...W.map(w => [w.id, w.name, w.helmet, w.co, w.zone, w.cond, w.skin ?? "", w.hr ?? "", w.ambient ?? ""])]
    : type === "alerts"
    ? [["Time", "Alert", "Helmet ID", "Location", "Severity", "Status", "Source"], ...A.map(a => [clock(a.t), a.type, a.helmet, a.zone, a.sev, a.status, a.live ? "Live helmet" : "Simulated"])]
    : [["Zone", "Air temperature C", "Relative humidity %", "Reporting helmets", "Dataset", "Method"], ...CLIMATE_ZONES.map(z => [z.zone, z.t, z.rh, z.online, "Simulated demo", "Helmet air sensor, not WBGT"])];
  const csv = rows.map(r => r.map(v => '"' + String(v).replaceAll('"', '""') + '"').join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = "smart-helmet-" + type + "-DEMO.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  S.siteReq = S.siteReq || {};
  const reqs = [["Return 18 idle clips", "HQ QSHE", S.assetDone && S.assetDone.t1 ? "Approved by HQ" : "Waiting for HQ", S.assetDone && S.assetDone.t1 ? "ok" : "warm", "Courier pickup Tue 4 Nov · charge drops to 34 clips"]];
  if (S.siteReq.more) reqs.push(["Need 5 more clips", "You · Site EHS", "Waiting for HQ", "warm", "HQ replies within 2 working days"]);
  if (S.siteReq.ret) reqs.push(["Return 4 more spare clips", "You · Site EHS", "Waiting for HQ", "warm", "Added to Tuesday pickup if approved"]);
  return `
    <div class="access"><span class="tag blue">VIEW ONLY</span><span>You see <b>Rasau WTP's clips only</b>. To get more clips or return spare ones, send a request. <b>HQ QSHE approves</b> and arranges delivery.</span></div>
    <div class="kpis">
      <div class="kpi"><span>On loan to this site</span><b>52</b><small>From HQ pool</small></div>
      <div class="kpi"><span>In use today</span><b style="color:var(--green)">30</b><small>Worn on shift</small></div>
      <div class="kpi warm"><span>Idle in site store</span><b>18</b><small>HQ asked to return</small></div>
      <div class="kpi hot"><span>Not seen</span><b>2</b><small>Please check store</small></div>
      <div class="kpi"><span>This month · project cost</span><b>RM122</b><small>52 clips × RM2.35</small></div>
    </div>
    <div class="pnl"><div class="pnl-h"><h3>${ic(P.list, 18)} Requests to HQ <small>The only actions available to site teams</small></h3></div>
      <div class="btnrow"><button type="button" class="act" data-areq="more">${S.siteReq.more ? "Request sent ✓" : "Request more clips"}</button><button type="button" class="act light" data-areq="ret">${S.siteReq.ret ? "Return request sent ✓" : "Return spare clips"}</button></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Request</th><th>Raised by</th><th>HQ decision</th><th>Next step</th></tr></thead><tbody>
      ${reqs.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="st ${r[3]}">${r[2]}</span></td><td>${r[4]}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="pnl"><div class="pnl-h"><h3>${ic(P.helmet, 18)} Clips needing site action <small>Storekeeper tasks only · repairs handled by HQ</small></h3></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Clip</th><th>Status</th><th>Last location</th><th>What to do</th></tr></thead><tbody>
        <tr><td class="mono"><b>SHC-189</b></td><td><span class="st alert">Not seen 3 days</span></td><td>Site store · Subcon B</td><td>Check store and Subcon B. Charge-back on day 7 if not found.</td></tr>
        <tr><td class="mono"><b>SHC-194</b></td><td><span class="st alert">Not seen 3 days</span></td><td>Site store · Subcon B</td><td>Same as above</td></tr>
        <tr><td class="mono"><b>SHC-118</b></td><td><span class="st warm">Idle 21 days</span></td><td>Site store</td><td>Pack for HQ pickup on Tuesday</td></tr>
      </tbody></table></div></div>`;
}

function assetPool() {
  const hq = (S.assetRole || "hq") === "hq";
  return `<div class="ehs">
    <aside class="side">
      <div class="brand"><div class="logo">${ic(P.shield, 24, "#F59E0B")}</div><div><span class="main">${hq ? "Asset pool" : "My clips"}</span><span class="sub">${hq ? "HQ QSHE · all projects" : "Site EHS · Rasau WTP"}</span></div></div>
      <nav aria-label="Sign in as">
        <button type="button" data-arole="hq" ${hq ? 'aria-current="page"' : ""}>${ic(P.shield, 20)}HQ QSHE view<span class="lk">HQ</span></button>
        <button type="button" data-arole="site" ${!hq ? 'aria-current="page"' : ""}>${ic(P.users, 20)}Site EHS view</button>
      </nav>
      <div class="role-note"><b>Demo switch.</b> In the real system the view depends on who signs in. Sites never see the HQ view.</div>
      <div class="side-foot">200 clips in pool · 1 live helmet · 199 simulated</div>
    </aside>
    <main class="ehs-main">
      <div class="ehs-head"><h1>${hq ? "Asset pool" : "My clips"}<small>${hq ? "Allocation, lifespan and condition · runs automatically, HQ only approves" : "Clips on loan to Rasau WTP from the HQ pool"}</small></h1>
        <div class="chips"><span class="mchip who ${hq ? "" : "site"}">${hq ? "Signed in as HQ QSHE · Admin" : "Signed in as Site EHS · Rasau WTP"}</span><span class="mchip sim">Simulated data</span></div></div>
      ${hq ? assetHQ() : assetSite()}
    </main></div>`;
}

function renderRight(){
  if (S.conn === "on") S.lastSeen = { t:Date.now(), where: S.inZone ? ZONE.ptw + " zone · " + ZONE.place : LIVE.zone };
  const box = $("right");
  const assetView = S.rightView === "asset";
  const ehsView = S.rightView === "ehs" || assetView;
  box.className = ehsView ? "desk" : "phone";
  $("rightWho").innerHTML = assetView ? `Asset pool<small>Clip allocation, lifespan and condition</small>` : ehsView ? `EHS control centre<small>Monitoring and reporting · whole site</small>` : `Supervisor's view<small>Faizal · Subcon A (Structure)</small>`;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.rightView));
  // keep scroll position and search typing while the page refreshes
  const keep = box.querySelector(".s-scroll, .ehs-main"); const top = keep ? keep.scrollTop : 0;
  const ae = document.activeElement, typing = ae && box.contains(ae) && ae.dataset.search ? { k:ae.dataset.search, pos:ae.selectionStart } : null;
  box.innerHTML = assetView ? assetPool() : ehsView ? ehs() : supervisor();
  const sc = box.querySelector(".s-scroll, .ehs-main"); if (sc) sc.scrollTop = top;
  if (typing) { const el = box.querySelector(`[data-search="${typing.k}"]`); if (el) { el.focus(); el.setSelectionRange(typing.pos, typing.pos); } }
}

function renderBar(){
  const on = S.conn === "on";
  $("liveChip").classList.toggle("on", on);
  $("liveTxt").textContent = on ? (S.real ? "Real helmet connected · live" : "Simulated helmet") : S.conn === "busy" ? "Helmet connecting…" : "Helmet not connected";
  $("btnSim").hidden = S.conn !== "off";
  $("barHint").textContent = on ? "Trigger an event:" : "Connect the helmet first:";
}
function flashHint(){ const h = $("barHint"); h.style.color = "var(--red)"; h.style.fontWeight = "700"; setTimeout(()=>{ h.style.color=""; h.style.fontWeight=""; }, 1200); }

function renderAll(){ renderWorker(); renderRight(); renderBar(); fit(); }

/* ======================================================================
   CLICKS
   ====================================================================== */
document.querySelectorAll("[data-trigger]").forEach(b => b.onclick = () => helmetEvent(b.dataset.trigger));
$("btnReset").onclick = () => {     // clears alerts but keeps the helmet connection and the EHS page
  stopCountdown(); helmetSend("RESOLVE_ALL"); helmetSend("ZONE_OFF");
  const keep = { conn:S.conn === "busy" ? "off" : S.conn, rightView:S.rightView, ehsPage:S.ehsPage, assetRole:S.assetRole,
    real:S.real, realHr:S.realHr, heatArmed:true, hrHighSince:0, skin:S.real ? S.skin : 35.4, air:S.air, hum:S.hum, hr:S.realHr ? S.hr : 96 };
  S = Object.assign(fresh(), keep);
  showWorker(S.conn === "on" ? "home" : "pair"); renderAll();
};
$("btnSos").onclick = () => helmetEvent("sos");
$("btnSim").onclick = simulateHelmet;
$("btnOff").onclick = () => helmetOffEvent();
$("btnSendHelp").onclick = () => confirmFall();
$("btnRest").onclick = () => workerResting();
$("btnTell").onclick = () => workerAsksHelp();
$("btnLeaveZone").onclick = () => workerLeftZone();
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem("helmetLang", lang); } catch(e) {}
  renderWorker();
});
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { S.rightView = b.dataset.view; S.sheet = null; renderRight(); fit(); });
$("right").addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.supTab = tab.dataset.tab; S.mapFocus = false; renderRight(); return; }
  const pg = e.target.closest("[data-ehs]");
  if (pg) { S.ehsPage = pg.dataset.ehs; renderRight(); const m = $("right").querySelector(".ehs-main"); if (m) m.scrollTop = 0; return; }
  const per = e.target.closest("[data-period]");
  if (per) { S.climPeriod = per.dataset.period; renderRight(); return; }
  const csv = e.target.closest("[data-csv]");
  if (csv) { downloadCSV(csv.dataset.csv); return; }
  const ar = e.target.closest("[data-arole]");
  if (ar) { S.assetRole = ar.dataset.arole; renderRight(); const m = $("right").querySelector(".ehs-main"); if (m) m.scrollTop = 0; return; }
  const ap = e.target.closest("[data-aapprove]");
  if (ap) { S.assetDone = Object.assign({}, S.assetDone, { [ap.dataset.aapprove]: true }); renderRight(); return; }
  const aq = e.target.closest("[data-areq]");
  if (aq) { S.siteReq = Object.assign({}, S.siteReq, { [aq.dataset.areq]: true }); renderRight(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = Number(el.dataset.id);
  if (act === "close" && (e.target === el || el.tagName === "BUTTON")) { S.sheet = null; renderRight(); }
  if (act === "info") { S.sheet = "info"; renderRight(); }
  if (act === "showmap") { S.sheet = null; S.supTab = "map"; S.mapFocus = true; renderRight(); const sc = $("right").querySelector(".s-scroll"); if (sc) sc.scrollTop = 0; }
  if (act === "backalert") { S.supTab = "alerts"; S.mapFocus = false; renderRight(); }
  if (act === "ack") { acknowledge(id); toast("Ahmad has been told you're coming"); }
  if (act === "resolve") { resolve(id); toast("Alert resolved and logged for EHS"); }
  if (act === "permit") { togglePermit(); }
  if (act === "offack") { helmetOffAck(); toast("Crew asked to check Bikash's helmet"); }
  if (act === "offresolve") { helmetOffResolve(); toast("Bikash's helmet is back on"); }
});
$("right").addEventListener("input", e => {
  if (e.target.dataset.search) { S.search[e.target.dataset.search] = e.target.value; renderRight(); }
});
$("callLink").href = $("callLink2").href = "tel:" + CONFIG.supervisorPhone;

/* ======================================================================
   LIVE READINGS + TIMERS
   ====================================================================== */
const drift = (v, step, min, max) => Math.min(max, Math.max(min, v + (Math.random()*2-1)*step));
setInterval(() => {
  if (S.conn !== "on") return;
  const heatOn = S.alerts.some(a => a.type === "heat" && a.status !== "resolved");
  if (!S.real) {                 // the real helmet sends its own readings
    S.air = drift(S.air, 0.3, 30, 35);
    S.hum = drift(S.hum, 1.5, 58, 78);
    if (!heatOn) S.skin = drift(S.skin, 0.2, 34.2, 36.8);
  }
  if (!S.realHr) S.hr = heatOn ? drift(S.hr, 2, 144, 152) : S.inZone ? drift(S.hr, 3, 102, 116) : drift(S.hr, 3, 84, 106);
  renderWorker();
  if (S.supTab === "workers" || S.rightView === "ehs") renderRight();
}, CONFIG.updateEveryMs);
setInterval(() => { if (activeAlerts().some(a => a.status === "new" || a.type === "zone") && S.rightView === "sup") renderRight(); }, 1000);
setInterval(() => {   // zone timer on the worker's phone
  const z = S.alerts.find(a => a.type === "zone" && a.status !== "resolved");
  if (z && S.workerScreen === "zone") $("zoneTimer").textContent = num(mmss(since(z.t)));
}, 1000);
setInterval(() => { if (S.rightView === "ehs" && S.conn !== "on") renderRight(); }, 5000);

/* Scale the whole stage to fit the projector screen */
function fit(){
  const st = $("stage"), bar = document.querySelector(".bar");
  st.style.zoom = 1;
  const z = Math.min(1.35, innerWidth / st.scrollWidth, (innerHeight - bar.offsetHeight) / st.scrollHeight);
  st.style.zoom = z;
}
addEventListener("resize", fit);

renderAll();
</script>
</body>
</html>
